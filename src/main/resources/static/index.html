<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live vehicle alerts</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0e141b;
      --panel: #17202b;
      --line: #2a3948;
      --text: #e7eef6;
      --muted: #93a4b5;
      --live: #3dd68c;
      --speeding: #ff5d73;
      --heat: #ffb020;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    main {
      max-width: 880px;
      margin: 0 auto;
      padding: 32px 20px 48px;
    }
    header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-start;
      margin-bottom: 20px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      letter-spacing: -0.03em;
    }
    p { margin: 0; color: var(--muted); line-height: 1.5; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 14px;
      white-space: nowrap;
    }
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--muted);
    }
    .status.live .dot { background: var(--live); }
    .status.down .dot { background: var(--speeding); }
    #alerts { display: grid; gap: 12px; }
    article {
      background: var(--panel);
      border: 1px solid var(--line);
      border-left: 4px solid var(--speeding);
      border-radius: 12px;
      padding: 14px 16px;
    }
    article.heat { border-left-color: var(--heat); }
    .meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 6px;
    }
    .type { font-weight: 700; letter-spacing: 0.04em; }
    article.speed .type { color: var(--speeding); }
    article.heat .type { color: var(--heat); }
    .message { font-size: 16px; }
    .empty {
      border: 1px dashed var(--line);
      border-radius: 12px;
      padding: 28px 16px;
      text-align: center;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Live vehicle alerts</h1>
        <p>Readings are published every 2 seconds for VH-001, VH-002, and VH-003. An alert appears here the moment speed passes 120 km/h or engine temperature passes 100 °C.</p>
      </div>
      <div id="status" class="status"><span class="dot"></span><span>Connecting</span></div>
    </header>
    <section id="alerts" aria-live="polite">
      <div class="empty" id="empty">Waiting for the next alert.</div>
    </section>
  </main>
  <script>
    const alerts = document.getElementById("alerts");
    const empty = document.getElementById("empty");
    const status = document.getElementById("status");
    const seen = new Set();

    function setStatus(mode, label) {
      status.className = "status " + mode;
      status.lastElementChild.textContent = label;
    }

    function addAlert(alert) {
      if (alert.id == null || seen.has(alert.id)) {
        return;
      }
      seen.add(alert.id);
      empty.remove();
      const card = document.createElement("article");
      const heat = alert.alertType === "ENGINE_OVERHEATING";
      card.className = heat ? "heat" : "speed";
      card.id = "alert-" + alert.id;
      const when = new Date(alert.timestamp).toLocaleString();
      card.innerHTML =
        '<div class="meta"><span class="type"></span><span class="when"></span></div>' +
        '<div class="message"></div>';
      card.querySelector(".type").textContent = alert.alertType + " · " + alert.vehicleId;
      card.querySelector(".when").textContent = when;
      card.querySelector(".message").textContent = alert.message;
      alerts.prepend(card);
    }

    async function loadRecent() {
      const response = await fetch("/api/alerts?size=20");
      if (!response.ok) {
        throw new Error("alerts request failed");
      }
      const page = await response.json();
      page.content.slice().reverse().forEach(addAlert);
    }

    function connect() {
      const source = new EventSource("/api/alerts/stream");
      source.onopen = () => setStatus("live", "Live");
      source.addEventListener("alert", (event) => {
        addAlert(JSON.parse(event.data));
      });
      source.onerror = () => setStatus("down", "Reconnecting");
    }

    loadRecent().catch(() => setStatus("down", "Alerts unavailable")).finally(connect);
  </script>
</body>
</html>
